[package]
name = "async-opcua"
version = "0.19.0"
description = "OPC UA client and server API"
authors = ["Adam Lock <locka99@gmail.com>", "Einar Omang <einar@omang.com>"]
homepage = "https://github.com/freeopcua/async-opcua"
repository = "https://github.com/freeopcua/async-opcua"
license = "MPL-2.0"
keywords = ["opcua", "opc", "ua"]
categories = ["network-programming"]
readme = "README.md"
documentation = "https://docs.rs/async-opcua/"
edition = "2021"
publish = true

[lib]
name = "opcua"

[features]
default = ["aws-lc-rs", "pubsub", "history"]
all = ["server", "client"]
aws-lc-rs = [
  "async-opcua-client?/aws-lc-rs",
  "async-opcua-core/aws-lc-rs",
  "async-opcua-crypto/aws-lc-rs",
  "async-opcua-server?/aws-lc-rs",
]
# Forwards to the crypto crate's support for legacy (deprecated) security
# policies: Basic128Rsa15 and Basic256.
legacy-crypto = [
  "async-opcua-client/legacy-crypto",
  "async-opcua-core/legacy-crypto",
  "async-opcua-crypto/legacy-crypto",
  "async-opcua-pubsub?/legacy-crypto",
  "async-opcua-server/legacy-crypto",
]
# Forwards to the crypto crate's NIST ECC security policies (ECC_nistP256 /
# ECC_nistP384) — feature 012. Pure-Rust elliptic-curve secure channels.
ecc = [
  "async-opcua-client?/ecc",
  "async-opcua-core/ecc",
  "async-opcua-crypto/ecc",
  "async-opcua-server?/ecc",
]
# opc.wss (WebSocket) transport (feature 009 / R5 / FR-044). Forwards to whichever of
# the client/server crates is enabled; TLS is layered on the in-tree rustls 0.23.
wss = ["async-opcua-client?/wss", "async-opcua-server?/wss"]
# Server default settings (includes pubsub + history-sqlite — feature 055)
server = ["base-server", "generated-address-space", "pubsub", "history"]
# Base server, without the core address space. Forwards ALL subsystem gates (feature
# 054) so its meaning — "the full server surface, minus the core nodeset" — is
# unchanged. Includes pubsub + history-sqlite (feature 055). For profile-minimal
# surfaces use the nano/micro/embedded/standard aliases below.
base-server = [
  "dep:async-opcua-server",
  "dep:async-opcua-nodes",
  "async-opcua-server/subscriptions",
  "async-opcua-server/subscriptions-standard",
  "async-opcua-server/events",
  "async-opcua-server/alarms",
  "async-opcua-server/method-call",
  "async-opcua-server/history",
  "async-opcua-server/history-aggregates",
  "async-opcua-server/query",
  "async-opcua-server/node-management",
  "async-opcua-server/diagnostics",
  "async-opcua-server/rbac",
  "async-opcua-server/gds",
  "async-opcua-server/fota",
  "async-opcua-server/programs",
  "async-opcua-server/lds",
  "pubsub",
  "history",
]
# --- OPC UA 2017 profile aliases (feature 054, updated 055) ---
# Use with default-features = false. Compositions are grounded in the OPC Foundation
# profile database (specs/054-profile-polish/research-assets/PROFILES-2017.md).
# These are benchmark/build surfaces, NOT OPC Foundation certification claims.
# Profiles exclude pubsub and history-sqlite (feature 055).
#
# Nano Embedded Device 2017 Server: core server surface only (sessions, read, browse,
# discovery-self, username/password tokens, policy-None channels). No subscriptions,
# methods, events, history, or security policies with certificates.
nano = ["dep:async-opcua-server", "dep:async-opcua-nodes"]
# Micro Embedded Device 2017 Server: Nano + basic data-change subscriptions
# (+ ≥2 parallel sessions, which is runtime configuration).
micro = ["nano", "async-opcua-server/subscriptions"]
# Embedded 2017 UA Server: Micro + standard data-change tier (deadband, triggering),
# GetMonitoredItems/ResendData (method call), served type system, real security.
embedded = [
  "micro",
  "async-opcua-server/subscriptions-standard",
  "async-opcua-server/method-call",
  "generated-address-space",
  "aws-lc-rs",
]
# Standard 2017 UA Server: Embedded + self-registration with an LDS. X509 user
# tokens and session Cancel are always-compiled core. Capacity CUs (≥50 sessions,
# ≥500 monitored items) are runtime configuration.
standard = ["embedded", "discovery-server-registration"]
# --- end profile aliases ---
# Client default settings
client = ["async-opcua-client"]
# Console logging just installs a logger that writes out to
# the screen, useful for general logging
# Allows a server to register itself with a local discovery server. It does so by
# becoming a client to the LDS, which brings in a dependency to async-opcua-client.
# Omitting the feature saves some memory.
discovery-server-registration = [
  "async-opcua-server/discovery-server-registration",
]
discovery-mdns = ["async-opcua-server/discovery-mdns"]
# Includes all the code to populate the address space with the default node set.
# This is something that embedded systems may or may not require.
generated-address-space = [
  "async-opcua-server/generated-address-space",
  "async-opcua-core-namespace",
]
# Methods for XML parsing and loading of nodesets from XML.
# The json feature adds serialize/deserialize to all OPC-UA types.
json = ["async-opcua-nodes/json", "async-opcua-types/json"]
xml = ["async-opcua-types/xml", "async-opcua-nodes/xml", "async-opcua-xml"]
# OPC UA Part 14 PubSub subsystem (async-opcua-pubsub), re-exported as opcua::pubsub.
# Opt-in; deliberately NOT in default to keep the minimal deployment footprint.
pubsub = ["dep:async-opcua-pubsub"]
# OPC UA Part 11 SQLite historical-storage backend (async-opcua-history-sqlite),
# re-exported as opcua::history. Opt-in; NOT in default (keeps SQLite out of minimal builds).
history = ["dep:async-opcua-history-sqlite"]


[dependencies]
chrono = { workspace = true }

async-opcua-client = { path = "../async-opcua-client", optional = true, version = "0.19.0", default-features = false }
async-opcua-core = { path = "../async-opcua-core", version = "0.19.0", default-features = false }
async-opcua-core-namespace = { path = "../async-opcua-core-namespace", optional = true, version = "0.19.0" }
async-opcua-crypto = { path = "../async-opcua-crypto", version = "0.19.0", default-features = false }
async-opcua-history-sqlite = { path = "../async-opcua-history-sqlite", optional = true, version = "0.19.0" }
async-opcua-macros = { path = "../async-opcua-macros", version = "0.19.0" }
async-opcua-nodes = { path = "../async-opcua-nodes", optional = true, version = "0.19.0" }
async-opcua-pubsub = { path = "../async-opcua-pubsub", optional = true, version = "0.19.0" }
async-opcua-server = { path = "../async-opcua-server", optional = true, default-features = false, version = "0.19.0" }
async-opcua-types = { path = "../async-opcua-types", version = "0.19.0" }
async-opcua-xml = { path = "../async-opcua-xml", optional = true, version = "0.19.0" }

[dev-dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
tokio-util = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }

# Include json when building tests
async-opcua = { path = ".", features = ["all", "json", "xml", "legacy-crypto", "wss", "pubsub", "history"] }

[package.metadata.docs.rs]
all-features = true
