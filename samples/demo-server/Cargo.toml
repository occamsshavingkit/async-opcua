[package]
name = "async-opcua-demo-server"
version = "0.13.0"
authors = ["Adam Lock <locka99@gmail.com>"]
edition = "2021"
publish = false

[dependencies]
chrono = { workspace = true }
log = { workspace = true }
log4rs = "1.2"
pico-args = "0.5"
rand = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dependencies.async-opcua-history-sqlite]
path = "../../async-opcua-history-sqlite"

[dependencies.async-opcua]
path = "../../async-opcua"
# `ecc` is required so the server can negotiate the ECC_nistP256/P384 security
# policies in the ECC conformance profile (sample.server.ecc.conf, `--ecc`).
features = ["all", "ecc"]

[features]
default = ["json", "xml", "pubsub"]
json = ["async-opcua/json"]
xml = ["async-opcua/xml"]
# OPC UA Part 14 PubSub subscriber wiring. Gates the `start_subscribers()`
# call in main.rs. `async-opcua` already enables `pubsub` transitively via
# `all` → `server` → `pubsub`, but this feature gates the demo-server-side
# subscriber startup code (OPC-10000-14 §5.4.6.2.2).
pubsub = ["async-opcua/pubsub"]
