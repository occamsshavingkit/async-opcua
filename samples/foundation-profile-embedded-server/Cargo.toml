[package]
name = "async-opcua-foundation-profile-embedded-server"
version = "0.13.0"
authors = ["Adam Lock <locka99@gmail.com>"]
edition = "2021"
publish = false

[features]
# Enables the profile behavior tests (tests/). NOT in default: under a unified
# multi-package build (e.g. `cargo test --workspace`) feature unification compiles
# the server WITH the gated subsystems, which inverts the rejection semantics.
# Run: cargo test -p async-opcua-foundation-profile-embedded-server --features profile-tests
profile-tests = []

[dependencies]
tokio = { version = "^1", default-features = false, features = ["macros", "rt", "signal"] }

[dependencies.async-opcua]
path = "../../async-opcua"
features = ["embedded"]
default-features = false

# Dev-only: in-tree client drives the profile tests; dev-deps do not affect the
# built benchmark binary (absence verified via tools/check-profile-absence.sh).
[dev-dependencies]
env_logger = "^0.11"
tokio = { version = "^1", default-features = false, features = [
  "macros",
  "rt",
  "net",
  "time",
] }

[dev-dependencies.async-opcua]
path = "../../async-opcua"
features = ["client", "aws-lc-rs"]
default-features = false
